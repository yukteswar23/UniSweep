<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UniSweep — AI research, university by university</title>
  <meta name="description" content="Explore AI faculty, research areas and recent papers at universities worldwide, plus what industry AI labs are publishing.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230e0e10'/><text x='16' y='22' font-size='17' font-family='Arial' font-weight='800' fill='white' text-anchor='middle'>U</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a class="logo" href="#/"><span class="logo-mark">U</span>UniSweep</a>
      <nav class="nav" aria-label="Main">
        <a href="#/universities">Universities</a>
        <a href="#/faculty">Faculty</a>
        <a href="#/areas">Research areas</a>
        <a href="#/labs">Industry labs</a>
        <a href="#/shortlist">Shortlist<span id="saved-count"></span></a>
      </nav>
      <div class="header-actions">
        <button class="search-trigger" id="search-btn" aria-label="Search">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span><kbd>Ctrl K</kbd>
        </button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode"></button>
        <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings &amp; profile">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="footer">
    <div class="container">
      <span>UniSweep · faculty data from <a href="https://csrankings.org" target="_blank" rel="noopener">CSRankings</a>, papers from <a href="https://openalex.org" target="_blank" rel="noopener">OpenAlex</a>.</span>
      <span>Press <kbd>Ctrl K</kbd> or <kbd>/</kbd> to search anywhere.</span>
    </div>
  </footer>

  <div class="palette-backdrop" id="palette" role="dialog" aria-modal="true" aria-label="Search">
    <div class="palette">
      <div class="palette-input">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="palette-input" placeholder="Search universities, professors, labs…" autocomplete="off" spellcheck="false">
        <kbd>Esc</kbd>
      </div>
      <div class="palette-results" id="palette-results"></div>
      <div class="palette-foot"><span>↑↓ navigate</span><span>↵ open</span><span>Esc close</span></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="data/data.js"></script>
  <script src="assets/js/labs.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/openalex.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/views.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
